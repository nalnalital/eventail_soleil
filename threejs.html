<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Simulation Rigoureuse - Rayons Crépusculaires</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0b16; color: #fff; font-family: sans-serif; }
        #info { 
            position: absolute; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; 
            pointer-events: none; line-height: 1.4; font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="info">
        <b>Simulation Rigoureuse</b><br>
        - <b>Soleil unique</b> très lointain (haut dans le ciel)<br>
        - <b>Couche nuageuse</b> percée de trous<br>
        - <b>Rayons parallèles</b> (lignes droites strictes)<br>
        <i>Utilise la souris pour tourner, zoomer et te placer sous les nuages.</i>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scène et Caméra
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111827);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Position initiale sous les nuages pour voir l'effet "depuis le sol"
        camera.position.set(0, -15, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);

        // 2. Le Soleil unique, très haut et lointain
        const sunGeo = new THREE.SphereGeometry(4, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd44 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(0, 60, -40);
        scene.add(sun);

        // 3. La Couche Nuageuse (un plan horizontal percé de trous)
        // On simule les "faisceaux" cylindriques/coniques parallèles qui traversent les trous
        const groupRays = new THREE.Group();
        
        // Matériau semi-transparent pour matérialiser la lumière diffusée dans l'air
        const rayMat = new THREE.MeshBasicMaterial({
            color: 0xffea88,
            transparent: true,
            opacity: 0.25,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        // Positions des trous dans la couche nuageuse (autour du centre)
        const holes = [
            { x: 0, z: 0 },
            { x: 4, z: 2 },
            { x: -5, z: 3 },
            { x: 3, z: -4 },
            { x: -4, z: -3 },
            { x: 7, z: -1 },
            { x: -7, z: 1 }
        ];

        // Création de rayons STRICTEMENT PARALLÈLES partant du soleil vers le sol
        holes.forEach(pos => {
            // Un cylindre long représente le couloir de lumière vertical traversant l'atmosphère
            const rayGeo = new THREE.CylinderGeometry(1.5, 3.5, 50, 16, 1, true);
            const ray = new THREE.Mesh(rayGeo, rayMat);
            
            // Position du trou dans la couche nuageuse (à y = 20)
            ray.position.set(pos.x, 0, pos.z);
            
            // On oriente les cylindres exactement dans la direction des rayons du soleil (parallélisme)
            // Tous les rayons ont la même inclinaison vectorielle
            groupRays.add(ray);
        });
        scene.add(groupRays);

        // Représentation visuelle de la couche de nuages (un grand plan gris)
        const cloudPlaneGeo = new THREE.PlaneGeometry(120, 120);
        const cloudPlaneMat = new THREE.MeshStandardMaterial({ 
            color: 0x4b5563, 
            roughness: 0.9, 
            side: THREE.DoubleSide 
        });
        const cloudPlane = new THREE.Mesh(cloudPlaneGeo, cloudPlaneMat);
        cloudPlane.rotation.x = -Math.PI / 2;
        cloudPlane.position.y = 20;
        scene.add(cloudPlane);

        // 4. Sol de référence
        const floorGeo = new THREE.PlaneGeometry(120, 120);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x1f2937, wireframe: true });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -25;
        scene.add(floor);

        // Éclairage global
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
