<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Simulation Rayons Parallèles Inclinés</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05050a; color: #fff; font-family: sans-serif; }
        #info { 
            position: absolute; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; 
            pointer-events: none; line-height: 1.4; font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="info">
        <b>Rayons strictement parallèles et inclinés</b><br>
        - Même vecteur de direction pour tous les rayons.<br>
        - Traversent les nuages et s'étendent en profondeur.<br>
        <i>Tourne la caméra sous les nuages pour observer l'effet de perspective.</i>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        // Caméra avec une focale standard (FOV 45)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -10, 40); // Placé sous les nuages

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 5, 0);

        // Vecteur directeur unique des rayons (le Soleil arrive de haut-gauche en profondeur)
        const sunDirection = new THREE.Vector3(0.3, -1, -0.4).normalize();

        // Matériau des rayons (lumineux et semi-transparent pour simuler la diffusion)
        const rayMat = new THREE.MeshBasicMaterial({
            color: 0xffe57f,
            transparent: true,
            opacity: 0.3,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        // Positions des trous dans la couche nuageuse (à y = 15)
        const cloudY = 15;
        const holes = [
            { x: 0, z: 0 },
            { x: 3, z: 2 },
            { x: -3, z: 1 },
            { x: 5, z: -2 },
            { x: -4, z: -3 },
            { x: 1, z: -4 },
            { x: -2, z: 4 }
        ];

        // Création des faisceaux parallèles inclinés
        holes.forEach(hole => {
            const length = 60;
            const rayGeo = new THREE.CylinderGeometry(1, 2.5, length, 16, 1, true);
            const ray = new THREE.Mesh(rayGeo, rayMat);

            // Position du centre du cylindre pour qu'il parte du trou nuageux
            const centerOffset = sunDirection.clone().multiplyScalar(-length / 2);
            ray.position.set(hole.x, cloudY, hole.z).add(centerOffset);

            // Orienter le cylindre exactement selon le vecteur sunDirection
            ray.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), sunDirection.clone().negate());

            scene.add(ray);
        });

        // Plan de la couche nuageuse
        const cloudPlaneGeo = new THREE.PlaneGeometry(100, 100);
        const cloudPlaneMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.9, side: THREE.DoubleSide });
        const cloudPlane = new THREE.Mesh(cloudPlaneGeo, cloudPlaneMat);
        cloudPlane.rotation.x = -Math.PI / 2;
        cloudPlane.position.y = cloudY;
        scene.add(cloudPlane);

        // Sol
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x111827, wireframe: true });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -20;
        scene.add(floor);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
